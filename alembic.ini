[alembic]
# Path to migration scripts
script_location = alembic

# IMPORTANT: This value is overridden at runtime by the
# DISCOVERY_ENGINE_DATABASE_URL or DATABASE_URL environment variable
# (see alembic/env.py). Do NOT put real passwords here. This placeholder
# intentionally uses an unreachable URL so a missing env var fails fast
# instead of silently connecting somewhere unexpected.
sqlalchemy.url = postgresql+psycopg://CHANGE_ME:CHANGE_ME@CHANGE_ME:5432/evidence_review

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
